<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa y caracterización de procesos · LOWRISK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("lowrisk-tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--fg:#18212E;--ink2:#2B3A52;--paper:#F6F8FB;--card:#FFFFFF;--line:#DCE3EC;--muted:#566173;--soft:#EEF1F5;--tipbg:#FFF8E6;--primary:#18212E;--on-primary:#FFFFFF;--navy:#18212E;
--yel:#F4C54A;--red:#E5534B;--grn:#3E9F5A;--lgn:#A9D49F;--focus:#1F56AE;
--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#EEF1F5;--ink2:#C9D3E1;--paper:#10151D;--card:#18202C;--line:#2C3747;--muted:#A3ADBD;--soft:#212B3A;--tipbg:#2E2A1C;--primary:#F4C54A;--on-primary:#18212E;--navy:#22314A;--focus:#6CB4EE}
 :root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"]{--fg:#EEF1F5;--ink2:#C9D3E1;--paper:#10151D;--card:#18202C;--line:#2C3747;--muted:#A3ADBD;--soft:#212B3A;--tipbg:#2E2A1C;--primary:#F4C54A;--on-primary:#18212E;--navy:#22314A;--focus:#6CB4EE}
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
.logo-d{display:none}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;min-height:76px;flex-wrap:wrap}
header.top img{height:40px;width:auto;display:block}
header.top img.logo-d,footer.brand img.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top img.logo-l,:root:not([data-theme="light"]) footer.brand img.logo-l{display:none}:root:not([data-theme="light"]) header.top img.logo-d,:root:not([data-theme="light"]) footer.brand img.logo-d{display:block}}
:root[data-theme="dark"] header.top img.logo-l,:root[data-theme="dark"] footer.brand img.logo-l{display:none}:root[data-theme="dark"] header.top img.logo-d,:root[data-theme="dark"] footer.brand img.logo-d{display:block}
header.top .title{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:20px}
header.top .title b{font-size:17px;font-weight:700}
header.top .title span{font-size:14px;color:var(--muted)}
header.top .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:600;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.steps{display:flex;gap:6px;margin:28px 0 20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);font-weight:600}
.step .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--fg);font-weight:800;font-size:14px}
.step[aria-current="step"]{background:var(--card);border-color:var(--line);color:var(--fg)}
.step[aria-current="step"] .n{background:var(--primary);color:var(--on-primary)}
.step.done .n{background:var(--grn);color:#fff}
main{padding-bottom:64px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}
.panel h1{font-size:30px;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.panel .lead{color:var(--muted);margin:0 0 24px;max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field .help{font-size:13.5px;color:var(--muted);margin-top:-2px}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,86,174,.15)}
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--tipbg);border-radius:12px;padding:14px 18px;margin-top:24px;font-size:15px}
.tip .sq{flex:none;display:grid;grid-template-columns:repeat(2,9px);gap:3px;margin-top:4px}
.tip .sq i{width:9px;height:9px;border-radius:2.5px;display:block}
.tip b{font-weight:700}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
/* procesos */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.type{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.type h2{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.type h2 .dot{width:16px;height:16px;border-radius:4px}
.type p{margin:0;color:var(--muted);font-size:14px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:6px 6px 6px 12px}
.plist li input{flex:1;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px}
.plist li input:focus{background:var(--card);border-color:var(--focus)}
.ico{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:16px;display:grid;place-items:center}
.ico:hover{background:var(--card);color:var(--fg)}
.empty{color:var(--muted);font-size:14px;font-style:italic}
/* caracterizacion */
.carlayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.plnav{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto;padding-right:4px}
.plnav .grp{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.plnav button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:14.5px}
.plnav button[aria-current="true"]{background:var(--soft);border-color:var(--line)}
.plnav .st{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.plnav .st.ok{background:var(--grn);border-color:var(--grn)}
.plnav .st.mid{background:var(--yel);border-color:var(--yel)}
.carform h2{margin:0 0 4px;font-size:22px}
.carform .sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.sec{margin:22px 0 10px;font-size:15px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.checks input{width:18px;height:18px;accent-color:var(--red)}
/* mapa */
.mapwrap{overflow-x:auto}
.map{min-width:860px;display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:14px;align-items:stretch}
.side{background:var(--navy);color:#fff;border-radius:14px;padding:18px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center}
.side b{font-size:14px;font-weight:800}
.side span{font-size:13.5px;opacity:.85;line-height:1.35}
.bands{display:flex;flex-direction:column;gap:12px}
.band{border-radius:14px;padding:14px 16px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
.band .bl{font-size:13.5px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:8px}
.band .bl i{width:12px;height:12px;border-radius:3px;display:block}
.tiles{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.tiles.flow .tile:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:0;height:0;border-left:8px solid var(--grn);border-top:7px solid transparent;border-bottom:7px solid transparent;transform:translateY(-50%)}
.tiles.flow{gap:14px}
.tile{position:relative;flex:1 1 130px;min-height:64px;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14.5px;line-height:1.3;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(24,33,46,.15)}
.tile .flag{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.mapmeta{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 20px;color:var(--muted);font-size:14.5px}
.mapmeta b{color:var(--fg)}
/* tortuga */
.turtle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tb{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);min-height:110px}
.tb h3{margin:0 0 6px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.tb ul{margin:0;padding-left:18px;font-size:14.5px}
.tb p{margin:0;font-size:14.5px;white-space:pre-line}
.tb .none{color:#9AA3B2;font-style:italic}
.tb.center{grid-row:span 1;border:0;color:#fff;display:flex;flex-direction:column;gap:8px}
.tb.center h3{color:inherit;opacity:.85}
.tb.center .pn{font-size:22px;font-weight:800;line-height:1.2}
.tb.center p,.tb.center ul{font-size:14px}
.carhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.carfoot{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700;background:var(--soft)}
.chip.on{background:#FDE7E5;color:#9E2B24}
footer.brand{border-top:1px solid var(--line);background:var(--card)}
footer.brand .wrap{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:18px;padding-bottom:18px;font-size:14px;color:var(--muted)}
footer.brand img{height:26px}
footer.brand a{color:var(--fg);font-weight:700}
.logobox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.logobox img{max-height:48px;max-width:200px;background:#fff;border-radius:6px;padding:4px}
.printonly{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){.grid2,.types{grid-template-columns:1fr}.carlayout{grid-template-columns:1fr}.plnav{max-height:none;flex-direction:row;flex-wrap:wrap}.plnav .grp{width:100%}.panel{padding:22px}.turtle,.carfoot{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
@media print{header.top.custom img{display:none!important}.printonly.has{display:block!important;max-height:56px;max-width:240px;margin:0 0 12px}header.top .act,.steps,.navrow,.noprint,.toast{display:none!important}body{background:#fff}.panel{border:0;padding:0}.printpage{break-after:page}.map{min-width:0}}
</style>
</head>

const STEPS = ["Tu empresa", "Tus procesos", "Caracterización", "Mapa y resultado"];
const TIPS = [
 "Tu mapa y tus caracterizaciones deben coincidir con el alcance de tu SGCS. Si una sede o actividad está en el alcance, sus procesos también deben aparecer aquí.",
 "Incluye los procesos que subcontratas y tocan la carga, como el transporte. Aunque los haga un tercero, siguen siendo tu responsabilidad (Norma 1.3).",
 "Un buen objetivo dice para qué existe el proceso, no lo que hace. Y cada proceso que toca la carga debería tener al menos un riesgo de seguridad identificado.",

let S = load() || blank();
S.procesos = (S.procesos||[]).filter(p=>TYPES.some(t=>t.id===p.tipo));
let step = S.step || 0, selected = S.selected || null, viewProc = null;

function blank(){return {empresa:{nombre:"",giro:"",sede:"",estandar:"",elaboro:"",fecha:new Date().toISOString().slice(0,10),entradas:"Requisitos de clientes, autoridades y partes interesadas",salidas:"Carga segura, clientes satisfechos y cumplimiento"},procesos:[],step:0,selected:null};}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
let saveT=null;
function save(){S.step=step;S.selected=selected;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"p"+Math.random().toString(36).slice(2,9);
const lines=s=>String(s||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
const typeOf=id=>TYPES.find(t=>t.id===id);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}
function procsOf(t){return S.procesos.filter(p=>p.tipo===t)}
function status(p){const c=p.car||{};const req=["objetivo","responsable","entradas","salidas"];const n=req.filter(k=>(c[k]||"").trim()).length;const any=FIELDS.some(f=>f.k&&(c[f.k]||"").trim());return n===req.length?"ok":any?"mid":""}
function tipHTML(i){return `<div class="tip"><span class="sq" aria-hidden="true"><i style="background:#F4C54A"></i><i style="background:transparent"></i><i style="background:#3E9F5A"></i><i style="background:#A9D49F"></i></span><div><b>Consejo.</b> ${esc(TIPS[i])}</div></div>`}

function renderSteps(){
  $("#steps").innerHTML=STEPS.map((s,i)=>`<button class="step ${i<step?'done':''}" type="button" data-step="${i}" ${i===step?'aria-current="step"':''}><span class="n">${i<step?'✓':i+1}</span>${s}</button>`).join("");
  $("#steps").querySelectorAll(".step").forEach(b=>b.onclick=()=>go(+b.dataset.step));
}
function go(i){step=i;viewProc=null;save();render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){renderSteps();[stepEmpresa,stepProcesos,stepCar,stepMapa][step]()}

function stepEmpresa(){
  const e=S.empresa;
  $("#view").innerHTML=`<h1>Empieza por tu empresa</h1><p class="lead">Estos datos aparecen en el encabezado del mapa y del PDF. Todo se guarda solo en este navegador.</p>
  <div class="grid2">
   ${fld("nombre","Nombre de la empresa","",e.nombre)}
   ${fld("giro","Giro o actividad","Por ejemplo: exportación de alimentos procesados.",e.giro)}
   ${fld("sede","Sedes incluidas en el alcance","",e.sede)}
   <div class="field"><label for="f-estandar">Estándar BASC que aplica</label><select id="f-estandar" data-k="estandar"><option value="">Selecciona</option>${["6.0.1 · Relación directa con la carga","6.0.2 · Relación indirecta con la carga","6.0.3 · Sin relación con la carga"].map(o=>`<option ${e.estandar===o?'selected':''}>${o}</option>`).join("")}</select></div>
   ${fld("elaboro","Elaborado por","",e.elaboro)}
   <div class="field"><label for="f-fecha">Fecha</label><input type="date" id="f-fecha" data-k="fecha" value="${esc(e.fecha)}"></div>
   ${fld("entradas","Entradas del mapa","Lo que recibe tu empresa; se muestra a la izquierda del mapa.",e.entradas)}
   ${fld("salidas","Salidas del mapa","Lo que entrega tu empresa; se muestra a la derecha.",e.salidas)}
   <div class="field" style="grid-column:1/-1"><label for="f-logo">Logo de tu empresa para el PDF (opcional)</label><span class="help">Reemplaza el logo del encabezado solo al exportar o imprimir. PNG o JPG.</span>
    <div class="logobox">${e.logo?`<img src="${e.logo}" alt="Logo cargado">`:`<span class="empty">Sin logo: se usará el de LOWRISK.</span>`}
     <input type="file" id="f-logo" accept="image/png,image/jpeg">${e.logo?`<button class="btn" type="button" id="quitarLogo">Quitar logo</button>`:""}</div></div>
  </div>${tipHTML(0)}
  <div class="navrow"><span></span><button class="btn primary" type="button" id="next">Siguiente: tus procesos</button></div>`;
  $("#view").querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{S.empresa[el.dataset.k]=el.value;save()});
  $("#f-logo").onchange=ev=>{const f=ev.target.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type)){toast("Usa un archivo PNG o JPG.");return}
    const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/im.width,240/im.height);const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);S.empresa.logo=cv.toDataURL("image/png");S.empresa.logoW=cv.width;S.empresa.logoH=cv.height;save();stepEmpresa();applyPrintLogo();toast("Logo cargado. Aparecerá en el PDF y al imprimir.")};
      im.onerror=()=>toast("No se pudo leer la imagen.");im.src=rd.result};rd.readAsDataURL(f)};
  const q=$("#quitarLogo");if(q)q.onclick=()=>{delete S.empresa.logo;delete S.empresa.logoW;delete S.empresa.logoH;save();stepEmpresa();applyPrintLogo()};
  $("#next").onclick=()=>go(1);
}
function fld(k,l,h,v){return `<div class="field"><label for="f-${k}">${l}</label>${h?`<span class="help">${h}</span>`:""}<input type="text" id="f-${k}" data-k="${k}" value="${esc(v)}"></div>`}

function stepProcesos(){
  $("#view").innerHTML=`<h1>Captura tus procesos</h1><p class="lead">Escribe cada proceso y presiona Agregar o Enter. Puedes renombrarlos, reordenarlos o eliminarlos.</p>
  <div class="types">${TYPES.map(t=>`<div class="type"><h2><span class="dot" style="background:${t.color}"></span>${t.label}</h2><p>${esc(t.hint)}</p>
   <form class="addrow" data-t="${t.id}"><label class="sr" for="add-${t.id}">Nuevo proceso ${t.short}</label><input type="text" id="add-${t.id}" placeholder="Nombre del proceso"><button class="btn" type="submit">Agregar</button></form>
   <ul class="plist" id="list-${t.id}"></ul></div>`).join("")}</div>${tipHTML(1)}
  <div class="navrow"><button class="btn" type="button" id="prev">Atrás</button><button class="btn primary" type="button" id="next">Siguiente: caracterización</button></div>`;
  TYPES.forEach(t=>drawList(t.id));
  $("#view").querySelectorAll("form.addrow").forEach(f=>f.onsubmit=ev=>{ev.preventDefault();const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;S.procesos.push({id:uid(),tipo:f.dataset.t,nombre:v,car:{}});inp.value="";save();drawList(f.dataset.t);inp.focus()});
  $("#prev").onclick=()=>go(0);
  $("#next").onclick=()=>{if(!S.procesos.length){toast("Agrega al menos un proceso para continuar.");return}go(2)};
}
function drawList(t){
  const ul=$("#list-"+t);const ps=procsOf(t);
  ul.innerHTML=ps.length?ps.map((p,i)=>`<li data-id="${p.id}"><label class="sr" for="n-${p.id}">Nombre</label><input type="text" id="n-${p.id}" value="${esc(p.nombre)}">
   <button class="ico" type="button" data-a="up" aria-label="Subir" ${i===0?'disabled':''}>↑</button><button class="ico" type="button" data-a="down" aria-label="Bajar" ${i===ps.length-1?'disabled':''}>↓</button><button class="ico" type="button" data-a="del" aria-label="Eliminar">✕</button></li>`).join(""):`<li class="empty" style="background:transparent;padding:0">Sin procesos todavía.</li>`;
  ul.querySelectorAll("li[data-id]").forEach(li=>{
    const id=li.dataset.id,p=S.procesos.find(x=>x.id===id);
    li.querySelector("input").oninput=e=>{p.nombre=e.target.value;save()};
    li.querySelectorAll("button").forEach(b=>b.onclick=()=>{

}

function stepCar(){

  const p=S.procesos.find(x=>x.id===selected),t=typeOf(p.tipo),c=p.car||(p.car={});

    const inp=f.t==="area"?`<textarea id="c-${f.k}" data-c="${f.k}">${esc(c[f.k])}</textarea>`:`<input type="text" id="c-${f.k}" data-c="${f.k}" value="${esc(c[f.k])}">`;

  });
  const html=body.split('<div class="sec">').map((chunk,i)=>i===0?chunk:'<div class="sec">'+chunk.replace(/(<\/div>(?:<p class="help"[^>]*>.*?<\/p>)?)/,'$1<div class="grid2">')+'</div>').join("");
  $("#view").innerHTML=`<h1>Caracteriza cada proceso</h1><p class="lead">Elige un proceso de la lista. Lo mínimo para darlo por completo: objetivo, responsable, entradas y salidas.</p>
  <div class="carlayout"><nav class="plnav" aria-label="Procesos">${nav}</nav>
  <div class="carform"><h2>${esc(p.nombre)}</h2><p class="sub">Proceso ${t.sing}</p>${html}
   <div class="sec">Criticidad del proceso</div><div class="checks">${[["carga","Toca la carga"],["info","Toca información de la carga"],["personal","Involucra personal crítico"]].map(([k,l])=>`<label><input type="checkbox" data-x="${k}" ${c["toca_"+k]?'checked':''}>${l}</label>`).join("")}</div>
   <div class="navrow"><button class="btn" type="button" id="prevP">Proceso anterior</button><button class="btn primary" type="button" id="nextP">Siguiente proceso</button></div></div></div>${tipHTML(2)}
  <div class="navrow"><button class="btn" type="button" id="prev">Atrás</button><button class="btn primary" type="button" id="next">Ver mapa y resultado</button></div>`;
  $("#view").querySelectorAll(".plnav button").forEach(b=>b.onclick=()=>{selected=b.dataset.id;save();stepCar();$(".carform").scrollIntoView({behavior:"smooth",block:"start"})});
  $("#view").querySelectorAll("[data-c]").forEach(el=>el.oninput=()=>{c[el.dataset.c]=el.value;save();const dot=$(`.plnav button[data-id="${p.id}"] .st`);if(dot)dot.className="st "+status(p)});
  $("#view").querySelectorAll("[data-x]").forEach(el=>el.onchange=()=>{c["toca_"+el.dataset.x]=el.checked;save()});
  const order=TYPES.flatMap(tt=>procsOf(tt.id)),idx=order.indexOf(p);
  $("#prevP").disabled=idx===0;$("#nextP").disabled=idx===order.length-1;
  $("#prevP").onclick=()=>{selected=order[idx-1].id;save();stepCar()};
  $("#nextP").onclick=()=>{selected=order[idx+1].id;save();stepCar()};
  $("#prev").onclick=()=>go(1);$("#next").onclick=()=>go(3);

function mapHTML(){
  const e=S.empresa;
  const band=t=>{const ps=procsOf(t.id);if(!ps.length&&t.id==="evaluacion")return"";
    return `<div class="band"><div class="bl"><i style="background:${t.color}"></i>Procesos ${t.label.toLowerCase()}</div><div class="tiles ${t.id==="operativo"?'flow':''}">${ps.length?ps.map(p=>{const c=p.car||{};const fl=c.toca_carga||c.toca_info||c.toca_personal;return `<button class="tile" type="button" data-id="${p.id}" style="background:${t.color};color:${t.text}" aria-label="${esc(p.nombre)}: ver caracterización">${esc(p.nombre)}${fl?'<span class="flag" aria-hidden="true"></span>':''}</button>`}).join(""):`<span class="empty">Sin procesos.</span>`}</div></div>`};
  return `<div class="mapwrap"><div class="map"><div class="side"><b>Entradas</b><span>${esc(e.entradas)}</span></div><div class="bands">${TYPES.map(band).join("")}</div><div class="side"><b>Salidas</b><span>${esc(e.salidas)}</span></div></div></div>

function stepMapa(){

function list(s){const l=lines(s);return l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="none">Sin capturar</p>`}
function turtleHTML(p){
  const c=p.car||{},t=typeOf(p.tipo);
  const box=(h,v)=>`<div class="tb"><h3>${h}</h3>${list(v)}</div>`;
  const center=`<div class="tb center" style="background:${t.color};color:${t.text}"><h3>Proceso ${esc(t.sing)}</h3><div class="pn">${esc(p.nombre)}</div>${c.objetivo?`<p><b>Objetivo:</b> ${esc(c.objetivo)}</p>`:""}${c.inicio||c.fin?`<p><b>Inicia con:</b> ${esc(c.inicio||"…")}<br><b>Termina con:</b> ${esc(c.fin||"…")}</p>`:""}${c.responsable?`<p><b>Responsable:</b> ${esc(c.responsable)}</p>`:""}</div>`;
  const ent=`<div class="tb"><h3>Proveedores y entradas</h3>${lines(c.proveedores).length?`<p><b>Proveedores</b></p>${list(c.proveedores)}`:""}<p style="margin-top:6px"><b>Entradas</b></p>${list(c.entradas)}</div>`;
  const sal=`<div class="tb"><h3>Salidas y clientes</h3><p><b>Salidas</b></p>${list(c.salidas)}${lines(c.clientes).length?`<p style="margin-top:6px"><b>Clientes</b></p>${list(c.clientes)}`:""}</div>`;
  const toca=[["carga","Carga"],["info","Información"],["personal","Personal crítico"]].map(([k,l])=>`<span class="chip ${c["toca_"+k]?'on':''}">${c["toca_"+k]?'Toca ':'No toca '}${l.toLowerCase()}</span>`).join("");
  return `<div class="turtle">${box("Recursos",c.recursos)}${box("Actividades principales",c.actividades)}${box("Indicadores",c.indicadores)}${ent}${center}${sal}${box("Riesgos",c.riesgos)}${box("Requisitos BASC",c.requisitos)}${box("Documentos y registros",c.documentos)}</div>
  <div class="carfoot"><div class="tb" style="min-height:0"><h3>Interacción con otros procesos</h3>${list(c.interaccion)}</div><div class="tb" style="min-height:0"><h3>Criticidad del proceso</h3><div class="chips">${toca}</div></div></div>`;
}
function turtleView(id){
  const p=S.procesos.find(x=>x.id===id);if(!p){viewProc=null;return stepMapa()}
  const order=TYPES.flatMap(tt=>procsOf(tt.id)),idx=order.indexOf(p);
  $("#view").innerHTML=`<div class="carhead"><div><h1>Caracterización</h1><p class="lead" style="margin:0">${esc(S.empresa.nombre||"")}</p></div>
   <div class="chips"><button class="btn" type="button" id="back">Volver al mapa</button><button class="btn" type="button" id="pp" ${idx===0?'disabled':''}>Anterior</button><button class="btn" type="button" id="np" ${idx===order.length-1?'disabled':''}>Siguiente</button><button class="btn" type="button" id="edit">Editar</button></div></div>${turtleHTML(p)}`;
  $("#back").onclick=()=>{viewProc=null;stepMapa()};
  $("#pp").onclick=()=>{viewProc=order[idx-1].id;turtleView(viewProc)};
  $("#np").onclick=()=>{viewProc=order[idx+1].id;turtleView(viewProc)};
  $("#edit").onclick=()=>{selected=p.id;go(2)};
}
function printAll(){

function hexRGB(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function buildPDF(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"letter"});
  const W=792,H=612,M=36,e=S.empresa;
  const footer=(n)=>{doc.setDrawColor(220,227,236);doc.line(M,H-40,W-M,H-40);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(86,97,115);
    doc.text(`Elaborado con la herramienta gratuita de LOWRISK · ${CONTACT.email} · ${CONTACT.tel}`,M,H-26);doc.text(`Página ${n}`,W-M,H-26,{align:"right"})};
  const header=(title)=>{try{if(e.logo){const bw=96,bh=34,k=Math.min(bw/(e.logoW||bw),bh/(e.logoH||bh));const w=(e.logoW||bw)*k,hh=(e.logoH||bh)*k;doc.addImage(e.logo,"PNG",M,22+(bh-hh)/2,w,hh)}else{doc.addImage(LOGO,"PNG",M,22,96,32)}}catch(err){}doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(24,33,46);doc.text(title,M+112,42);
    doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(86,97,115);const meta=[e.nombre,e.giro,e.estandar?("Estándar "+e.estandar.split(" ·")[0]):"",e.fecha,e.elaboro?("Elaboró: "+e.elaboro):""].filter(Boolean).join("  |  ");doc.text(meta,M+112,56,{maxWidth:W-M*2-112})};
  let page=1;header("Mapa de procesos");
  // mapa
  const top=82,bottom=H-56,sideW=96,gap=10,bx=M+sideW+gap,bw=W-2*M-2*(sideW+gap);
  const bands=TYPES.filter(t=>procsOf(t.id).length||t.id!=="evaluacion");
  const sideBox=(x,title,txt)=>{doc.setFillColor(24,33,46);doc.roundedRect(x,top,sideW,bottom-top,8,8,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(10);
    doc.text(title,x+sideW/2,(top+bottom)/2-20,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text(doc.splitTextToSize(txt||"",sideW-16),x+sideW/2,(top+bottom)/2-4,{align:"center"})};
  sideBox(M,"Entradas",e.entradas);sideBox(W-M-sideW,"Salidas",e.salidas);
  const bh=(bottom-top-gap*(bands.length-1))/bands.length;
  bands.forEach((t,bi)=>{const y=top+bi*(bh+gap);doc.setFillColor(238,241,245);doc.roundedRect(bx,y,bw,bh,8,8,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(43,58,82);doc.setFillColor(...hexRGB(t.color));doc.roundedRect(bx+10,y+9,8,8,2,2,"F");doc.text("Procesos "+t.label.toLowerCase(),bx+24,y+16);
    const ps=procsOf(t.id);if(!ps.length)return;const perRow=Math.min(ps.length,6),rows=Math.ceil(ps.length/perRow);const ty=y+24,th=(bh-30-(rows-1)*6)/rows,tw=(bw-20-(perRow-1)*12)/perRow;
    ps.forEach((p,i)=>{const r=Math.floor(i/perRow),k=i%perRow,x=bx+10+k*(tw+12),yy=ty+r*(th+6);doc.setFillColor(...hexRGB(t.color));doc.roundedRect(x,yy,tw,th,6,6,"F");
      doc.setTextColor(...hexRGB(t.text));doc.setFont("helvetica","bold");doc.setFontSize(8.5);const tl=doc.splitTextToSize(p.nombre,tw-10).slice(0,3);doc.text(tl,x+tw/2,yy+th/2-(tl.length-1)*5+3,{align:"center"});
      const c=p.car||{};if(c.toca_carga||c.toca_info||c.toca_personal){doc.setFillColor(229,83,75);doc.circle(x+tw-6,yy+6,2.6,"F")}
      if(t.id==="operativo"&&k<perRow-1&&i<ps.length-1){doc.setFillColor(62,159,90);doc.triangle(x+tw+3,yy+th/2-4,x+tw+3,yy+th/2+4,x+tw+9,yy+th/2,"F")}});
  });
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(86,97,115);doc.setFillColor(229,83,75);doc.circle(M+4,bottom+8,2.6,"F");doc.text("Toca carga, información o personal crítico",M+12,bottom+11);

    doc.addPage();page++;header("Caracterización del proceso");const c=p.car||{},t=typeOf(p.tipo);
    const gx=M,gy=74,gw=W-2*M,cw=(gw-2*10)/3,ch=136;
    const cell=(col,row,title,txt,opt={})=>{const x=gx+col*(cw+10),y=gy+row*(ch+10);

      doc.setTextColor(...(opt.fill?hexRGB(opt.text):[43,58,82]));doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(title,x+10,y+16);

      if(ls.length>max){ls=ls.slice(0,max);ls[max-1]=ls[max-1].replace(/.{0,2}$/,"…")}doc.text(ls,x+10,y+30)};

    cell(1,1,p.nombre,[`Proceso ${t.sing}`,c.objetivo?("Objetivo: "+c.objetivo):"",(c.inicio||c.fin)?(`Inicia con: ${c.inicio||"…"}. Termina con: ${c.fin||"…"}.`):"",c.responsable?("Responsable: "+c.responsable):""].filter(Boolean),{fill:t.color,text:t.text});
    cell(2,1,"Salidas y clientes",["Salidas:",...bl(c.salidas),...(lines(c.clientes).length?["Clientes:",...bl(c.clientes)]:[])]);
    cell(0,2,"Riesgos",bl(c.riesgos));cell(1,2,"Requisitos BASC",bl(c.requisitos));cell(2,2,"Documentos y registros",bl(c.documentos));
    const y2=gy+3*(ch+10);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(43,58,82);
    doc.text("Interacción: ",M,y2+4);doc.setFont("helvetica","normal");doc.setTextColor(24,33,46);doc.text(doc.splitTextToSize(lines(c.interaccion).join(", ")||"Sin capturar",W-2*M-300).slice(0,2),M+56,y2+4);
    const toca=[c.toca_carga?"carga":"",c.toca_info?"información":"",c.toca_personal?"personal crítico":""].filter(Boolean);
    doc.setFont("helvetica","bold");doc.setTextColor(toca.length?158:86,toca.length?43:97,toca.length?36:115);doc.text(toca.length?("Criticidad: toca "+toca.join(", ")):"Criticidad: no toca carga, información ni personal crítico",W-M,y2+4,{align:"right"});
    footer(page)});
  return doc;
}

function applyPrintLogo(){const im=$("#printLogo"),hd=$("header.top");if(S.empresa.logo){im.src=S.empresa.logo;im.classList.add("has");hd.classList.add("custom")}else{im.removeAttribute("src");im.classList.remove("has");hd.classList.remove("custom")}}
function temaActual(){const a=document.documentElement.getAttribute("data-theme");return a||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function pintarBotonTema(){const d=temaActual()==="dark";const b=$("#btnTema");b.textContent=d?"☀ Modo claro":"☾ Modo oscuro";b.setAttribute("aria-label",d?"Cambiar a modo claro":"Cambiar a modo oscuro")}
$("#btnTema").onclick=()=>{const n=temaActual()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("lowrisk-tema",n)}catch(e){}pintarBotonTema()};
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",pintarBotonTema);
pintarBotonTema();
applyPrintLogo();
render();
</script>
</body>
</html>
